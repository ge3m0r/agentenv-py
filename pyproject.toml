[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentenv-py"
version = "0.1.0"
description = "A small Python reconstruction of AgentENV's core lifecycle"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AgentENV Python contributors" }]
keywords = ["agent", "sandbox", "orchestrator", "snapshot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
aenv-py = "agentenv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
